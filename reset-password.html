<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сброс пароля | СМДЛЕД</title>
  <link rel="stylesheet" href="style.css">
</head>
<body style="display:flex; justify-content:center; align-items:center; height:100vh; background:#0f172a; color:white; margin:0;">
  
  <div class="modal-card" style="width:100%; max-width:400px; padding:20px;">
    <h2 style="text-align:center; margin-bottom:20px;">Сброс пароля</h2>
    <form id="reset-form" style="display:flex; flex-direction:column; gap:15px;">
      <div class="form-group">
        <label>Новый пароль</label>
        <input type="password" id="new-password" class="form-input" required minlength="6" placeholder="Минимум 6 символов">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%">Сохранить</button>
    </form>
    <div id="reset-msg" style="margin-top:15px; text-align:center; color:#10b981;"></div>
    <div style="text-align:center; margin-top:20px;">
      <a href="/" style="color:#3b82f6; text-decoration:none;">Вернуться к входу</a>
    </div>
  </div>

  <script>
    document.getElementById('reset-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token');
      const newPassword = document.getElementById('new-password').value;

      if (!token) return alert('Отсутствует токен!');

      try {
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Ошибка');
        
        document.getElementById('reset-msg').textContent = 'Пароль успешно изменен! Вы можете войти.';
        document.getElementById('reset-form').style.display = 'none';
      } catch (err) {
        alert(err.message);
      }
    });
  </script>
</body>
</html>
